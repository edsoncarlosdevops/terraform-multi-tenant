# ─── SAST: Análise Estática de Segurança ─────────────────────
# Escaneia Terraform, Kubernetes YAML, Dockerfiles e dependências
# Ferramentas: Checkov (IaC) + Trivy (containers + IaC)

name: Security - SAST

on:
  pull_request:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'bootstrap/**'
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

jobs:
  checkov-iac:
    name: Checkov - IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov Scan (Terraform + K8s)
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: false
          output_format: sarif
          output_file_path: checkov-results.sarif
          skip_check: CKV_AWS_338 # Pular check de VPC Flow Logs (não obrigatório em dev)

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Checkov Summary
        if: always()
        run: |
          echo "### 🔍 Checkov Results" >> $GITHUB_STEP_SUMMARY
          echo '| Severity | Count |' >> $GITHUB_STEP_SUMMARY
          echo '|----------|-------|' >> $GITHUB_STEP_SUMMARY
          echo '| 🔴 HIGH   | $(jq '.runs[0].results | map(select(.level == "error")) | length' checkov-results.sarif) |' >> $GITHUB_STEP_SUMMARY
          echo '| 🟡 MEDIUM | $(jq '.runs[0].results | map(select(.level == "warning")) | length' checkov-results.sarif) |' >> $GITHUB_STEP_SUMMARY
          echo '| ⚪ LOW    | $(jq '.runs[0].results | map(select(.level == "note")) | length' checkov-results.sarif) |' >> $GITHUB_STEP_SUMMARY

  trivy:
    name: Trivy - IaC + Secrets + Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          scanners: vuln,secret,misconfig

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  tflint:
    name: TFLint - Terraform Linter
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [dev, staging, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init
        working-directory: environments/${{ matrix.environment }}

      - name: TFLint
        run: tflint --format compact --maximum-warning-threshold=10
        working-directory: environments/${{ matrix.environment }}

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
