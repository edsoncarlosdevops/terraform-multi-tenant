# ═══════════════════════════════════════════════════════════════
# TAG RELEASE — Versionamento SemVer automatico
# ═══════════════════════════════════════════════════════════════
# Cria tags no repositorio seguindo SemVer a cada push na main.
# A tag vira o "snapshot" do codigo naquele momento.
#
# Se nao existir nenhuma tag, comeca em v0.1.0
# Senao, incrementa patch: v0.1.0 → v0.1.1
#
# CORRECAO: Se nao houver tag anterior, o git log falha.
# Agora tratamos esse caso com if/else.
# ═══════════════════════════════════════════════════════════════

name: Release - Version Tag

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'bootstrap/**'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: semver
        run: |
          # Tenta pegar a ultima tag. Se nao existir, comeca em v0.0.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          # Incrementa patch: v0.0.0 → v0.1.0 (primeira release)
          # Se ja existe: v0.1.0 → v0.1.1
          MAJOR=$(echo $LAST_TAG | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo $LAST_TAG | cut -d. -f2)
          PATCH=$(echo $LAST_TAG | cut -d. -f3)

          # Se a tag atual for v0.0.0 (nenhuma tag real), pula para v0.1.0
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            # Primeira release: comeca em v0.1.0
            echo "new_tag=v0.1.0" >> $GITHUB_OUTPUT
          else
            # Senao, incrementa patch
            NEW_TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        id: notes
        run: |
          LAST_TAG="${{ steps.semver.outputs.last_tag }}"
          NEXT_TAG="${{ steps.semver.outputs.new_tag }}"

          echo "## 🏗️ Release $NEXT_TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ─── Gera release notes apenas se ja existe tag anterior ──
          if [ "$LAST_TAG" != "v0.0.0" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            git log --oneline "$LAST_TAG"...HEAD --no-merges > release-notes.txt
            cat release-notes.txt | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          else
            echo "- Primeira release do projeto!" >> $GITHUB_STEP_SUMMARY
            echo "- Commit inicial: $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.semver.outputs.new_tag }} -m "Release ${{ steps.semver.outputs.new_tag }}"
          git push origin ${{ steps.semver.outputs.new_tag }}
