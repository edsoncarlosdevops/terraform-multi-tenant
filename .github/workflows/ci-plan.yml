# ─── CI: Terraform Plan em Pull Requests ─────────────────────
# Roda em todo PR para validar as mudanças antes do merge
# Comentários automáticos com o plano e estimativa de custo

name: CI - Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'bootstrap/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.changed-envs.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed-envs
        run: |
          ENVS=$(git diff --name-only origin/main...HEAD | grep '^environments/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "environments=${ENVS:-[]}" >> $GITHUB_OUTPUT

  terraform-plan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.environments != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - uses: terraform-linters/setup-tflint@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: environments/${{ matrix.environment }}

      - name: TFLint
        run: tflint --init && tflint --format compact
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Init
        run: terraform init
        working-directory: environments/${{ matrix.environment }}
        env:
          AWS_REGION: us-east-1

      - name: Terraform Validate
        run: terraform validate
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: environments/${{ matrix.environment }}
        continue-on-error: true

      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `## 🤖 Plan - \`${{ matrix.environment }}\`
            <details><summary>Show Plan</summary>
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>
            ${{ steps.plan.outcome == 'success' && '✅ Plan succeeded' || '❌ Plan failed' }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
